spring:
  application:
    name: forohub

  datasource:
    url: jdbc:postgresql://${DB_HOST}/forohub
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
api:
  security:
    token:
      secret: ${JWT_SECRET:1j2p3c4d5u6a7a8e9}